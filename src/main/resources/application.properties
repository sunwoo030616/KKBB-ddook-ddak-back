spring.application.name=kb-ai-backend
server.port=8080
openai.api.key=${OPENAI_API_KEY:}
app.cors.allowed-origins=http://localhost:5173,https://kkbb-ddookddak.netlify.app

# 대화 세션 (되묻기 이어가기)
app.session.ttl-minutes=30
app.session.max-sessions=10000

# 판단 근거 트레이스 (원문 메시지는 저장하지 않음)
app.trace.retention-minutes=60
app.trace.max-traces=500

# 금융 액션 정책
app.policy.step-up-krw=1000000
app.policy.deny-krw=5000000
app.policy.night-start-hour=0
app.policy.night-end-hour=6
app.policy.zone=Asia/Seoul
app.policy.max-attempts=3
app.policy.velocity-window-minutes=10
app.action.ttl-minutes=5
app.action.max-otp-attempts=3
# 시연 환경 전용: 문자 발송 대신 인증번호를 응답에 포함 (운영에서는 false)
app.action.expose-demo-otp=true
