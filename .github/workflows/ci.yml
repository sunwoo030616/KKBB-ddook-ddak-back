name: CI

on:
  push:
    branches: [ "main", "feat/**", "fix/**" ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379/tcp
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test
        env:
          KKBB_TEST_REDIS: "true"
          SPRING_DATA_REDIS_PORT: ${{ job.services.redis.ports[6379] }}
        run: ./mvnw -B test

      - name: Test report
        if: always()
        run: |
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] && grep -h "Tests run" "$f"
          done
