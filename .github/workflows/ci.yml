name: CI

on:
  push:
    branches: [ "main", "feat/**", "fix/**" ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test
        run: ./mvnw -B test

      - name: Test report
        if: always()
        run: |
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] && grep -h "Tests run" "$f"
          done
